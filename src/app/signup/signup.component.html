<div class="auth-container">
  <div class="auth-card">
    <h2>Create an account</h2>
    <p class="subtitle">Enter your details to sign up.</p>

    <form (ngSubmit)="onSignup()" #signupForm="ngForm">
      <div class="input-group">
        <input type="text" placeholder="Full Name" name="name" [(ngModel)]="name" required />
      </div>

      <div class="input-group">
        <input type="email" placeholder="Email Address" name="email" [(ngModel)]="email" required />
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password" name="password" [(ngModel)]="password" required />
      </div>

      <button type="submit" class="btn-primary" [disabled]="!signupForm.valid">
        Sign Up
      </button>
    </form>

    <p class="footer">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
